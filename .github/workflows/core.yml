name: Native core, Python bindings and CPU trainer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [native-test, python-bindings-test, trainer-smoke-test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and validate ${{ matrix.target }}
        run: docker build --target "${{ matrix.target }}" -t "meshtrain-${{ matrix.target }}:ci" --progress plain .
      - name: Exchange bytes between two containers
        if: matrix.target == 'native-test'
        run: sh tools/check_tcp_containers.sh meshtrain-native-test:ci
      - name: Verify centralized SUM across four containers
        if: matrix.target == 'native-test'
        run: sh tools/check_collective_containers.sh meshtrain-native-test:ci
      - name: Verify ring SUM and controller cleanup across four containers
        if: matrix.target == 'native-test'
        run: |
          python3 tools/check_ring_containers.py meshtrain-native-test:ci --output build/ring-containers
          python3 tools/check_ring_containers.py meshtrain-native-test:ci --scenario worker-exit --output build/ring-container-failure
