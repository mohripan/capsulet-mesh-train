name: M1 full CPU validation

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run clean native, package and four-container acceptance
        run: python3 tools/check_m1.py --no-cache --output build/m1-validation
      - name: Reclaim recorded validation resources
        if: always()
        run: python3 tools/cleanup_validation.py --output build/m1-validation
      - name: Retain numerical, failure and cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m1-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/m1-validation
          if-no-files-found: error
          retention-days: 14
